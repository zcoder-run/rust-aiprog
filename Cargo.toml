[package]
name = "aiprog"
version = "0.0.5-WIP"
description = "AI program runtime and API set (from Function Calling to Program Running)"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = [ "development-tools", "api-bindings" ]
keywords = ["ai", "lua", "mcp", "llm", "agent"]
authors = ["Jeremy Chone"]
homepage = "https://github.com/zcoder-run/rust-aiprog"
repository = "https://github.com/zcoder-run/rust-aiprog"


[lib]
doctest = false

[lints.clippy]
# infallible_destructuring_match = "allow" # for now

[lints.rust]
unsafe_code = "forbid"
# unused = { level = "allow", priority = -1 } # For exploratory dev.

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace]
members = [
    ".",
    "crates/aiprog-macros",
]
resolver = "3"

[dependencies]
# -- Macros
aiprog-macros = { version = "0.0.3", path = "crates/aiprog-macros" }
# -- Async
tokio = { version = "1", features = ["full"] }
# -- AI
genai = { version = "0.7.0-beta.21" }
udiffx = { version = "0.3", features = ["prompt"]}
aicost = { version = "0.2"}
markex = { version = "0.3.0" }
sysone = { version = "0.0.3" }
# -- Json & Data Formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["macros"] }
jsonc-parser = { version = "0.33", features = ["serde"]}
schemars = "1.2.1"
value-ext = "0.1.3"
toml = "1"
yaml_serde = "0.10.7"
csv = "1"
lopdf = {version = "0.45", features = ["time"]}
# -- Web
reqwest = {version = "0.13", features = ["json", "stream"]}
# -- Lua
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize", "async"] }
# -- String pasers, matchers, ormatters
logos = "0.16"
aho-corasick = "1.1.3"
lazy-regex = "3.4.1"
regex = "1"
num-format = "0.4.4"
humantime = "2.3.0"
textwrap = "0.16"
# -- Hash
blake3 = "1.8.2"
sha2 = "0.11"
# -- BaseX
base64 = "0.23"
bs58 = "0.5.1"
hex = "0.4" # Added for hex encoding
# -- Files
simple-fs = { version = "0.12.1", features = ["with-json"]}
size = "0.5.0"
glob = "0.3"
# -- HTML & XML
# git = "https://github.com/jeremychone/rust-htmlr"
htmlr = { version = "0.1.7" }
url = "2.5.7"
quick-xml = "0.42"
# -- Others
derive_more = { version = "2", features = ["display", "from"] }
time = { version = "0.3.44", features = ["formatting", "local-offset"]}
time-tz = {version = "2.0.0", features = ["system"]}

[dev-dependencies]
assertables = "10"
tempfile = "3"

