[package]
name = "aiprog-macros"
version = "0.0.5"
edition = "2024"
description = "Rust engine for moving from AI tool calls to AI program execution"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/zcoder-run/aiprog"
repository = "https://github.com/zcoder-run/aiprog"
categories = [
  "development-tools",
  "api-bindings"
]
keywords = [
  "ai",
  "lua",
  "mcp",
  "llm",
  "agent"
]

[lib]
proc-macro = true
doctest = false

[lints.rust]
unsafe_code = "forbid"
# unused = { level = "allow", priority = -1 } # For exploratory dev.

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
aiprog = { path = "../.." }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
